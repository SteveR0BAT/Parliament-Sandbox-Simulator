name: Publish Parliament Sandbox Simulator

on:
  push:
    branches: [main]
    paths:
      - "archive_parts/**"
      - ".github/workflows/deploy.yml"
      - "scripts/**"
      - "google5cf083c303490fdb.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Automatically extract uploaded ZIP
        run: |
          test -n "$(find archive_parts -maxdepth 1 -type f -name 'part-*' -print -quit)"
          cat archive_parts/part-* | base64 --decode | xz --decompress --stdout > parliament-sandbox-simulator.zip
          mkdir website
          unzip -q parliament-sandbox-simulator.zip -d website
          test -f website/package.json
          test -f website/src/app/page.tsx


      - name: Prepare Next.js for static hosting
        run: python scripts/prepare_static.py

      - name: Add configurable generic deputy names
        run: python scripts/add_deputy_names.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Build static website
        working-directory: website
        run: npm run build

      - name: Verify static export
        run: |
          test -s website/out/index.html
          test -s website/out/google5cf083c303490fdb.html
          grep -Fxq 'google-site-verification: google5cf083c303490fdb.html' website/out/google5cf083c303490fdb.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
